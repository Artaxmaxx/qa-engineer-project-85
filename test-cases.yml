---
- summary: |
    Проверка создания игры авторизованным пользователем
  requirement: |
    Создать игру может только авторизованный пользователь
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    Логин = Artaxmaxx
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Bot
    - Нажимаем кнопку Create battle
  expected-result: |
    Начинается игра

- summary: |
    Проверка создания игры не авторизованным пользователем
  requirement: |
    Создать игру может только авторизованный пользователь
  prerequisites: |
    Открыта страница игры
    Пользователь не авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
  expected-result: |
    Кнопки начать игру нет, начать игру нельзя

- summary: |
    Проверка создания игры без предварительного выбора языка программирования
  requirement: |
    Создать игру можно без предварительного выбора языка программирования
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Bot
    - Нажимаем кнопку Create battle
  expected-result: |
    Начинается игра, в которой можно выбрать язык программирования

- summary: |
    Проверка ожидания второго игрока при создании игры
  requirement: |
    Должен быть режим ожидания второго игрока при создании игры
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Create battle
  expected-result: |
    Появляется окно ожидания второго игрока

- summary: |
    Проверка отображения игры в списке доступных для подключения
  requirement: |
    Созданная игра против живого человека должна отображается в списке “доступных для подключения”.
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Create battle
    - Нажимаес кнопку Close
    - Нажимаем кнопку Join Battle
  expected-result: |
    Видим созданную нами игру в списке ожидания

- summary: |
    Проверка подключения игрока к созданной игре
  requirement: |
    Должна быть кнопка для подключения второго игрока
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Join battle
    - Нажимаем кнопку Fight
  expected-result: |
    Начинается игра

- summary: |
    Проверка системы матчмейкинга
  requirement: |
    Система должна иметь механизм матчмейкинга
  prerequisites: |
    Открыта страница игры
    Пользователь 1 авторизован в браузере Опера
    Пользователь 2 авторизован в браузере Хром
  test-data: |
    браузер Хром
    браузер Опера
  steps:
    - Пользователь 1 нажимаем кнопку Create battle
    - Пользователь 1 нажимаем кнопку Create battle
    - Пользователь 2 нажимаем кнопку Join battle
    - Пользователь 2 нажимаем кнопку Fight напротив игры 1 пользователя
  expected-result: |
    у обоих пользователей начинается игра

- summary: |
    Проверка синхронности игры
  requirement: |
    Система должна синхронизировать состояние игры для обоих игроков.
  prerequisites: |
    Открыта игровая сессия у пользователя 1 в браузере Опера и пользователя 2 в браузере Хром
  test-data: |
    браузер Хром
    браузер Опера
  steps:
    - Пользователь 1 вводит любые символы в своем окне
    - Пользователь 2 вводит любые символы в своем окне
  expected-result: |
    у обоих пользователей синхронно отображаются введеные символы в окне противника

- summary: |
    Наличие двух полей редактора в игровой сессии
  requirement: |
    В игре должно быть два редактора слева — свой, справа — соперника.
  prerequisites: |
    Открыта игровая сессия
  test-data: |
    браузер Хром
  steps:
   expected-result: |
    Видно два поля с кодом, одно своё для ввода данных, второе противника где видно его введенные данные
