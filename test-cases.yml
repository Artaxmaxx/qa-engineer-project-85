  expected-result: |
    Кнопки начать игру нет, начать игру нельзя

- summary: |
    3 Проверка создания игры без предварительного выбора языка программирования
  requirement: |
    Создать игру можно без предварительного выбора языка программирования
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Bot
    - Нажимаем кнопку Create battle
  expected-result: |
    Начинается игра, в которой можно выбрать язык программирования

- summary: |
    4 Проверка ожидания второго игрока при создании игры
  requirement: |
    Должен быть режим ожидания второго игрока при создании игры
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Create battle
  expected-result: |
    Появляется окно ожидания второго игрока

- summary: |
    5 Проверка отображения игры в списке доступных для подключения
  requirement: |
    Созданная игра против живого человека должна отображается в списке “доступных для подключения”.
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Create battle
    - Нажимаес кнопку Close
    - Нажимаем кнопку Join Battle
  expected-result: |
    Видим созданную нами игру в списке ожидания

- summary: |
    6 Проверка подключения игрока к созданной игре
  requirement: |
    Должна быть кнопка для подключения второго игрока
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Join battle
    - Нажимаем кнопку Fight
  expected-result: |
    Начинается игра

- summary: |
    7 Проверка системы матчмейкинга
  requirement: |
    Система должна иметь механизм матчмейкинга
  prerequisites: |
    Открыта страница игры
    Пользователь 1 авторизован в браузере Опера
    Пользователь 2 авторизован в браузере Хром
  test-data: |
    браузер Хром
    браузер Опера
  steps:
    - Пользователь 1 нажимаем кнопку Create battle
    - Пользователь 1 нажимаем кнопку Create battle
    - Пользователь 2 нажимаем кнопку Join battle
    - Пользователь 2 нажимаем кнопку Fight напротив игры 1 пользователя
  expected-result: |
    у обоих пользователей начинается игра

- summary: |
    8 Проверка синхронности игры
  requirement: |
    Система должна синхронизировать состояние игры для обоих игроков.
  prerequisites: |
    Открыта игровая сессия у пользователя 1 в браузере Опера и пользователя 2 в браузере Хром
  test-data: |
    браузер Хром
    браузер Опера
  steps:
    - Пользователь 1 вводит любые символы в своем окне
    - Пользователь 2 вводит любые символы в своем окне
  expected-result: |
    у обоих пользователей синхронно отображаются введеные символы в окне противника

- summary: |
    9 Наличие двух полей редактора в игровой сессии
  requirement: |
    В игре должно быть два редактора слева — свой, справа — соперника.
  prerequisites: |
    Открыта игровая сессия
  test-data: |
    браузер Хром
  steps:
  expected-result: |
    Видно два поля с кодом, одно своё для ввода данных, второе противника где видно его введенные данные

- summary: |
    10 Проверка расположения задания и времени
  requirement: |
    в сессии игры задание сверху, время игры под ним
  prerequisites: |
    Открыта игровая сессия
  test-data: |
    браузер Хром
  steps:
  expected-result: |
    Видим задание написанное сверху а под ним время игры

- summary: |
    11 Количественная попытка нажатия кнопки Run
  requirement: |
    Кнопка “Run” для проверки кода в сессии игры имеет неограниченное количество попыток
  prerequisites: |
    Открыта игровая сессия
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Run не менее 10 раз
    - Спамим нажатие кнопки Run не менее 30 секунд
  expected-result: |
    Происходит проверка написанного кода после каждого успелного нажатия

- summary: |
    12 Проверка восстановления игровой сессии после ее закрытия
  requirement: |
    Система должна поддерживать восстановление активной игровой сессии по ее идентификатору (ID) без потери текущего прогрессаКнопка “Run” для проверки кода в сессии игры имеет неограниченное количество попыток
  prerequisites: |
    Открыта игровая сессия
    Внесены изменения в поле ввода кода
  test-data: |
    браузер Хром
  steps:
    - Закрываем вкладку игровой сессии
    - Заходим на сайт игры
    - Нажимаем кнопку Back to the game
  expected-result: |
    Происходит восстановление игровой сессии с тем же id и с внесенными изменениями

- summary: |
    13 Проверка возможности проверки кода на чужом поле
  requirement: |
    Система должна изолировать процессы проверки, запуск тестов должен быть доступен только для редактора игрока
  prerequisites: |
    Открыта игровая сессия
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Run
  expected-result: |
    Кнопка Run только на своем игровом поле, ее нажатие выполняет проверку только своего кода

- summary: |
    14 Проверка вывода модального окна при победе
  requirement: |
    При успешной проверке выводится модальное окно победитель определён
  prerequisites: |
    Открыта игровая сессия
    В ней введен правильный код для выполнения условий победы
  test-data: |
    браузер Хром
  steps:
    - Нажимаем кнопку Run
  expected-result: |
    Появляется модальное окно с уведомлением о победе

- summary: |
    15 Проверка кнопки Check после победы
  requirement: |
    При победе кнопка “Run” блокируется 
  prerequisites: |
    Открыто модальное окно с уведомлением о победе
  test-data: |
    браузер Хром
  steps:
    - Нажимаем крестик
    - Нажимаем кнопку Run
  expected-result: |
    Кнопка Run не активна

- summary: |
    16 Проверка кнопки Exit после победы
  requirement: |
    При победе появляется кнопка “Exit”
  prerequisites: |
    Открыто модальное окно с уведомлением о победе
  test-data: |
    браузер Хром
  steps:
    - Нажимаем крестик
  expected-result: |
    Появляется кнопка Exit

- summary: |
    17 Проверка времени закрытия игры после победы
  requirement: |
    При победе можно остаться и смотреть на код. 
  prerequisites: |
    Открыто модальное окно с уведомлением о победе
  test-data: |
    браузер Хром
  steps:
    - Находимся в окне 5 минут
  expected-result: |
    игра не заканчивается

- summary: |
    18 Проверка закрытия игровой сессии при выходе игроков
  requirement: |
    Игровая сессия продолжается до моменат выхода обоих игроков
  prerequisites: |
    Открыта игровая сессия у 2 пользователей
  test-data: |
    браузер Хром
  steps:
    - Пользователь 1 выходит из игровой сессии
    - Пользователь 2 выходит из игровой сессии
  expected-result: |
    Через 1 минуту нельзя вернуться в игровую сессию

- summary: |
    19 Проверка правки игрового поля соперника
  requirement: |
    В игре нельзя править редактор соперника
  prerequisites: |
    Открыта игровая сессия
  test-data: |
    браузер Хром
  steps:
    - Нажимаем на игровое поле соперника
    - Вводим любые символы
  expected-result: |
    Игровое поле соперника нельзя редактировать

- summary: |
    20 Проверка правильного кода проигравшим игроком
  requirement: |
    Действия проигравшего игрока после завершения игры не должны влиять на результат матча.
  prerequisites: |
    Открыта модальное окно о поражениее
  test-data: |
    браузер Хром
  steps:
    - Нажимаем на крестик
    - В своем игровом окне пишем правильный код
    - Нажимаем кнопку Run
  expected-result: |
    Результаты игры не меняются, тесты проходят проверку

- summary: |
    21 Проверка возможности изменения языка програмирования в игровой сессии
  requirement: |
    Система должна позволять игроку изменять выбранный язык программирования в процессе игры без потери написанного кода
  prerequisites: |
    Открыта игровая сессия
    Выбран язык Java
  test-data: |
    браузер Хром
  steps:
    - Нажимаем окно выбора кода
    - Выбираем Python 3.15
  expected-result: |
    Меняется язык програмирования в игровом окне

- summary: |
    22 Проверка внешнего вида на телефоне
  requirement: |
    Сайт должен быть удобным на мобильном устройстве
  prerequisites: |
    Открыта игровая сессия
    Выбран Iphone SE в девтулс
  test-data: |
    браузер Хром
  steps:
    - скролим до конца вних
    - скролим до конца вверх
    - называем кнпку Join battle
    - называем кнпку Fight
    - скролим до конца вних
    - скролим до конца вверх
  expected-result: |
    Мы перемещаемся по меню согласно скролам, вся информация отображается на своих местах, не обрезана
