---
- summary: |
    1 Проверка создания игры авторизованным пользователем
  requirement: |
    Создать игру может только авторизованный пользователь
  prerequisites: |
    Открыта страница игры
    Пользователь авторизован
  test-data: |
    Логин = Artaxmaxx
  steps:
    - Нажимаем кнопку Create battle
    - Нажимаем кнопку Bot
    - Нажимаем кнопку Create battle
  expected-result: |
    Начинается игра

- summary: |
    2 Проверка создания игры не авторизованным пользователем
  requirement: |
    Создать игру может только авторизованный пользователь
  prerequisites: |
    Открыта страница игры
    Пользователь не авторизован
  test-data: |
    браузер Хром
  steps:
