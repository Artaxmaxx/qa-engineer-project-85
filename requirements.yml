---
functional:
  - Создать игру может только авторизованный пользователь
  - Система должна позволять создавать игровую сессию без предварительного выбора языка программирования.
  - Должен быть режим ожидания второго игрока при создании игры
  - Созданная игра против живого человека должна отображается в списке “доступных для подключения”.
  - Должна быть кнопка для подключения второго игрока “Connect to game”.
  - Система должна иметь механизм матчмейкинга
  - Система должна синхронизировать состояние игры для обоих игроков.
  - В игре должно быть два редактора слева — свой, справа — соперника.
  - в сессии игры задание сверху, время игры под ним
  - Кнопка “Check” для проверки кода в сессии игры имеет неограниченное количество попыток
  - Система должна поддерживать восстановление активной игровой сессии по ее идентификатору (ID) без потери текущего прогресса
  - Система должна изолировать процессы проверки, запуск тестов должен быть доступен только для редактора игрока
  - Игра идёт неограниченно, до первого успешного решения
  - При успешной проверке выводится модальное окно победитель определён
  - При победе кнопка “Check” блокируется. Появляется кнопка “Exit”. Можно остаться и смотреть на код. 
  - Игровая сессия продолжает до моменат выхода обоих игроков
  - Проигравший может продолжать писать, проверять код или выйти
  - Система должна поддерживать жизненный цикл игровой сессии active (игра идет), finished (определен победитель, но сессия открыта), closed (оба игрока покинули игру).
non-functional:
  - Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть удобным на мобильном устройстве
  - Сайт должен быть протестирован на совместимость с последними версиями браузеров
  - Сайт должен быть способен обрабатывать большое количество трафика, более 1000 пользоваателей одновременно
  - Система должна использовать протокол WebSocket для обеспечения передачи данных в режиме реального времени с задержкой не более 80 мс.
  - Система должна корректно обрабатывать обрыв соединения у одного из игроков.
  - Система должна обеспечивать двустороннюю синхронизацию текста (OT/CRDT) для предотвращения конфликтов при одновременном наборе кода игроками
  - Система должна освобождать ресурсы (удалять сессию из памяти) только после того, как оба участника покинут игру.
implicit:
  - В игре нельзя править редактор соперника
  - Победителем в модально окне указан первый из игроков чей код прошел проверку
  - Действия проигравшего игрока после завершения игры не должны влиять на результат матча.
  - Система должна позволять игроку изменять выбранный язык программирования в процессе игры без потери написанного кода
